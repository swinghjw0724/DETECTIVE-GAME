<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>생활 속 사건파일 | 기술·가정 추리 게임</title>
<style>
:root{font-family:system-ui,-apple-system,'Pretendard','Malgun Gothic',sans-serif;color:#f2f5ff;background:#0d1329}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 8%,#273760 0,transparent 32%),radial-gradient(circle at 90% 50%,#263b4c 0,transparent 32%),#0d1329}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.shell{max-width:1160px;margin:auto;padding:22px 20px 70px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.emblem{width:54px;height:54px;display:grid;place-items:center;font-size:30px;background:#f6c866;color:#15203d;border:3px solid #fff2b6;border-radius:16px;box-shadow:0 5px 0 #ac7c28}.sub{color:#aab8d4;font-size:13px}.muted{color:#b5c3dd}.tiny{font-size:12px}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #536385;border-radius:999px;padding:7px 11px;background:#1b2848;color:#dfe9ff;font-size:13px}.btn{border:0;border-radius:13px;padding:12px 18px;background:#f6c866;color:#19253f;font-weight:800;box-shadow:0 4px 0 #a98236}.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}.btn.alt{background:#30446e;box-shadow:0 4px 0 #1a2949;color:#f0f4ff}.btn.red{background:#ff9c92;box-shadow:0 4px 0 #b85e5d}.btn.small{padding:8px 12px;border-radius:10px;font-size:13px}.hero{margin-top:24px;border:2px solid #4c5d83;border-radius:24px;padding:28px;background:linear-gradient(132deg,#26365e,#172440 65%,#1b3e4a);box-shadow:0 12px 35px #0005;position:relative;overflow:hidden}.hero:after{content:'🔎';position:absolute;font-size:165px;right:10px;bottom:-60px;opacity:.13;transform:rotate(-22deg);pointer-events:none}.hero h1{font-size:clamp(29px,5vw,51px);line-height:1.18;margin:6px 0 12px}.hero p{max-width:690px;line-height:1.7;color:#d0dafa}.highlight{color:#ffdb79}.section{margin-top:25px}.sectiontitle{font-size:22px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.case{border:2px solid #41537b;background:#1b2848;padding:20px;border-radius:20px;position:relative;transition:.2s;min-height:208px}.case:hover{border-color:#e6c36f;transform:translateY(-2px)}.case h3{font-size:21px;margin:9px 0}.case .large{font-size:34px}.case p{color:#bdcbe6;line-height:1.5}.case-heading{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.difficulty{display:inline-flex;align-items:center;white-space:nowrap;border-radius:999px;border:1px solid #8b9ab8;padding:5px 10px;font-size:12px;line-height:1.25;font-weight:800;vertical-align:middle}.difficulty.easy{background:#184b43;color:#b9ffe1;border-color:#3f9d7d}.difficulty.medium{background:#55431e;color:#ffe6a3;border-color:#ba9149}.difficulty.hard{background:#5a303d;color:#ffd3d6;border-color:#bf7585}.case .tag{color:#f8d67e;font-size:12px;font-weight:700;letter-spacing:.1em}.case.done{border-color:#54cda3}.bar{height:10px;background:#0c1429;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#5bd1ad,#f5d478);transition:width .2s}.panel{border:2px solid #47597f;border-radius:21px;background:#1b2848;padding:22px;margin-top:17px}.panel h2{margin:0 0 12px}.notebook{background:#f3e6c8;color:#303446;border:3px solid #b9a47b;border-radius:12px;padding:16px 20px;box-shadow:inset 0 0 0 2px #e1d0a8;line-height:1.7}.notebook strong{color:#4d3b32}.evidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.evidence{display:flex;align-items:flex-start;text-align:left;gap:10px;background:#223558;border:2px solid #405781;color:white;border-radius:15px;padding:13px;min-height:100px}.evidence:hover{border-color:#e7ca7c}.evidence.opened{background:#264f51;border-color:#5bd1ad}.evidence .emo{font-size:30px}.evidence .status{font-size:11px;color:#92ddb6}.sheet{background:#f8f3e8;color:#2d3550;padding:22px;border-radius:16px;border:3px solid #cdbd96;box-shadow:0 4px 0 #a89677;line-height:1.7}.sheet h3{margin-top:0;color:#2e405e}.sheet .desc{white-space:pre-line}.question{margin:16px 0;padding:15px;border:1px solid #4d6186;border-radius:16px;background:#192744}.question h3{margin:0 0 10px;font-size:17px}.option{display:block;width:100%;text-align:left;border:2px solid #455980;color:#eaf0ff;padding:13px;margin:9px 0;border-radius:12px;background:#25375b}.option.selected{border-color:#ffd979;background:#4a4356}.option:hover{border-color:#ffe09a}.toast{border-radius:11px;padding:12px 16px;margin:12px 0;background:#325052;color:#ddfff1}.warning{background:#5e423e;color:#fff0d9}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.input{width:100%;background:#0f1a35;border:2px solid #536688;color:white;border-radius:12px;padding:12px;outline:none}.input:focus{border-color:#f4cb70}textarea.input{min-height:110px}.field{margin:10px 0}.field label{display:block;margin:0 0 6px;color:#d9e4f9}.result-score{font-size:55px;font-weight:900;color:#ffda7a}.stage{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.stage span{border-radius:10px;background:#2d4269;padding:9px 12px;color:#afc0de;font-size:13px}.stage span.active{background:#f0c66a;color:#19213b;font-weight:800}.stage span.passed{background:#205e5b;color:#d8fff1}.modal{position:fixed;inset:0;background:#070a14d9;display:grid;place-items:center;padding:15px;z-index:50}.modal .inner{max-width:720px;width:100%;max-height:88vh;overflow:auto;background:#203154;border:2px solid #697ba2;border-radius:21px;padding:24px}.hide{display:none!important}footer{text-align:center;color:#9daecb;margin-top:35px;font-size:12px}@media(max-width:650px){.grid,.evidence-grid{grid-template-columns:1fr}.shell{padding:14px 12px 50px}.hero{padding:22px}.panel{padding:15px}.hero:after{font-size:95px}}@media print{body{background:white;color:black}.top,.btn,.stage,footer{display:none!important}.panel,.sheet{border-color:#777;background:white;color:black}}
.detective-badge{text-align:center;background:radial-gradient(circle at 50% 0%,#49547d,#1b2848 70%);border:3px solid #f1ca73}.award-top{font-weight:800;color:#ffdf95;letter-spacing:.13em}.medal{width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,#fff2a4,#e4a638);color:#634414;font-size:78px;display:grid;place-items:center;margin:16px auto;border:8px solid #ffe7a0;box-shadow:0 6px 18px #0007}.detective-badge h2{font-size:32px;color:#ffe099}.award-name{font-size:28px;font-weight:900;margin:12px}.award-bottom{color:#b7c8ed}.detective-badge p{line-height:1.8;color:#e1e9ff}@media print{body *{visibility:hidden!important}#badgeSection,#badgeSection *{visibility:visible!important}#badgeSection{position:absolute;left:0;top:0;width:100%;background:white!important;color:#142541!important;border:4px solid #b78b2b!important}#badgeSection p,#badgeSection .award-bottom{color:#142541!important}#badgeSection button{display:none!important}}
</style></head><body><div id="app" class="shell"></div><div id="modal" class="modal hide" role="dialog" aria-modal="true"><div class="inner" id="modalInner"></div></div>
<script>
'use strict';
const DEFAULT_CASES=[

{id:'fridge',difficulty:'초급',icon:'🥛',title:'냉장고 속 수상한 우유',topic:'식생활 · 식품 보관',intro:'개봉한 우유에서 이상한 냄새가 난다. 날짜만 확인하면 안전할까?',story:'지우는 개봉한 우유를 냉장고 문 쪽에 두었다. 며칠 뒤 냄새가 달라졌지만 표시된 소비기한은 아직 남아 있었다.',clues:[{icon:'📅',title:'포장 표시',text:'포장에 적힌 소비기한은 미개봉 상태에서 표시된 보관 조건을 지켰을 때를 기준으로 한다.'},{icon:'🚪',title:'보관 위치',text:'우유는 냉장고 문 쪽에 보관되어 문을 여닫을 때 온도 변화가 잦았다.'},{icon:'🥛',title:'개봉 기록',text:'우유는 5일 전에 개봉했다. 개봉 후에는 표시된 소비기한만으로 안전을 판단할 수 없다.'},{icon:'🌡️',title:'온도 기록',text:'냉장고 안쪽 온도는 약 4℃였지만 문 쪽은 온도 변화가 컸다.'},{icon:'👃',title:'상태 확인',text:'평소와 다른 냄새가 났다. 맛을 보아 안전 여부를 확인해서는 안 된다.'},{icon:'🧼',title:'예방 수칙',text:'개봉일을 기록하고 제품의 개봉 후 보관 안내를 따르며, 변질이 의심되면 섭취하지 않는다.'}],questions:[{q:'소비기한이 남았는데도 주의해야 하는 이유는?',options:['소비기한은 모든 개봉 식품의 안전을 보장한다','개봉 후에는 보관 조건과 오염 가능성이 달라진다','냉장고에 넣으면 음식은 절대 상하지 않는다'],answer:1,why:'소비기한은 정해진 보관 조건을 전제로 하며 개봉 후에는 별도 주의가 필요합니다.'},{q:'이 우유를 어떻게 처리해야 할까?',options:['한 모금 마셔 보고 판단한다','설탕을 넣어 냄새를 가린다','섭취하지 않고 폐기한다'],answer:2,why:'변질이 의심되는 식품은 맛보지 말고 폐기해야 합니다.'},{q:'올바른 보관 습관은?',options:['개봉일과 보관 안내를 확인하고 적정 냉장 온도를 유지한다','문을 열어 둔 채 보관한다','소비기한만 보고 보관 상태는 무시한다'],answer:0,why:'개봉일·보관 방법·온도 관리를 함께 확인합니다.'}],culprit:'개봉 후 관리 부족과 불안정한 냉장 보관',closing:'식품 안전은 날짜뿐 아니라 개봉 여부와 보관 상태까지 확인해야 한다!'},
{id:'laundry',difficulty:'초급',icon:'👔',title:'하얀 셔츠의 푸른 얼룩',topic:'의생활 · 세탁과 분류',intro:'흰 셔츠가 세탁 후 푸르게 물들었다. 세탁 바구니에 단서가 있다.',story:'흰 면 셔츠를 새 청바지와 함께 세탁한 뒤 셔츠 일부가 푸르게 변했다. 세탁 과정에서 어떤 일이 있었을까?',clues:[{icon:'👖',title:'새 청바지',text:'진한 남색 청바지는 처음 세탁하는 제품이었으며 이염 가능성이 안내되어 있었다.'},{icon:'🧺',title:'세탁물 분류',text:'흰 셔츠와 진한 색 청바지를 같은 세탁망 없이 함께 넣었다.'},{icon:'🏷️',title:'취급 표시',text:'청바지 라벨에는 단독 세탁 권장이 적혀 있었다.'},{icon:'💧',title:'세탁 기록',text:'세탁 중 물에 푸른 염료가 일부 빠져나온 흔적이 있었다.'},{icon:'👔',title:'셔츠 소재',text:'셔츠는 흰색 면 소재로 다른 옷에서 나온 염료가 묻으면 눈에 띄기 쉽다.'},{icon:'🧴',title:'예방 안내',text:'새 진한 색 옷은 취급 표시를 확인하고 밝은 색 옷과 분리해 세탁하는 것이 안전하다.'}],questions:[{q:'셔츠가 푸르게 변한 가장 유력한 원인은?',options:['세탁기 소음','청바지에서 빠진 염료가 셔츠로 옮겨간 이염','셔츠의 단추 수'],answer:1,why:'진한 색 옷의 염료가 다른 세탁물로 옮겨갈 수 있습니다.'},{q:'다음 세탁에서 적절한 방법은?',options:['흰옷과 새 진한 색 옷을 분리한다','모든 옷을 항상 온수로 세탁한다','취급 표시를 확인하지 않는다'],answer:0,why:'색상과 소재, 취급 표시를 기준으로 세탁물을 분류합니다.'},{q:'세탁 전에 먼저 확인할 정보는?',options:['옷의 가격표','구입한 요일','의류 취급 표시와 이염 주의 문구'],answer:2,why:'취급 표시는 적절한 세탁 방법을 알려 줍니다.'}],culprit:'새 진한 색 청바지와 흰 셔츠의 혼합 세탁',closing:'세탁 전 분류만 잘해도 이염 사고를 줄일 수 있다!'},
{id:'electric',difficulty:'중급',icon:'🔌',title:'꺼지지 않는 멀티탭의 경고',topic:'주생활 · 전기 안전',intro:'멀티탭에서 열과 탄 냄새가 난다. 위험한 사용 습관을 찾아라.',story:'방에서 전기히터와 여러 전자기기를 하나의 멀티탭에 연결해 사용하던 중 플러그 주변이 뜨거워지고 탄 냄새가 났다.',clues:[{icon:'🔥',title:'연결 기기',text:'전기히터처럼 소비전력이 큰 기기가 멀티탭에 연결되어 있었다.'},{icon:'🔢',title:'정격 표시',text:'멀티탭에는 허용 전력과 전류가 표시되어 있으며 이를 초과하면 과열 위험이 있다.'},{icon:'🔗',title:'연결 상태',text:'멀티탭에 다른 멀티탭을 이어 연결한 흔적이 있다.'},{icon:'👃',title:'이상 징후',text:'플러그 주변에서 탄 냄새와 과열이 확인되었다.'},{icon:'🧯',title:'긴급 행동',text:'연기나 불꽃이 있으면 접근하거나 물을 뿌리지 말고 안전한 곳으로 대피해 119에 신고한다.'},{icon:'🛠️',title:'점검 안내',text:'손상·과열된 전기용품은 재사용하지 말고 전원을 안전하게 차단할 수 있을 때만 차단한 후 전문가에게 점검을 맡긴다.'}],questions:[{q:'가장 의심되는 위험 요인은?',options:['콘센트의 색깔','허용 용량을 고려하지 않은 과부하 사용','방의 벽지 무늬'],answer:1,why:'허용 용량을 초과하면 과열과 화재 위험이 커집니다.'},{q:'연기나 불꽃이 보일 때 적절한 행동은?',options:['물을 뿌린다','원인을 찾으려고 계속 사용한다','즉시 대피하고 119에 신고한다'],answer:2,why:'전기 화재가 의심되면 안전 확보와 신고가 우선입니다.'},{q:'평소 예방 방법은?',options:['정격 용량을 확인하고 고전력 기기의 연결 방식을 점검한다','멀티탭을 무제한 이어 붙인다','뜨거운 플러그를 계속 사용한다'],answer:0,why:'정격 용량 확인과 안전한 전기기기 사용이 중요합니다.'}],culprit:'멀티탭 과부하와 부적절한 연결',closing:'전기 안전은 편리함보다 정격 용량과 이상 징후 확인이 먼저!'},
{id:'subscription',difficulty:'중급',icon:'📱',title:'매달 사라지는 9,900원',topic:'소비생활 · 디지털 구독',intro:'사용하지 않는 서비스에서 매달 돈이 빠져나간다. 결제 내역을 조사하라.',story:'서연이는 무료 체험을 신청한 뒤 잊고 있었다. 통장에는 매달 9,900원이 결제되고 있었다.',clues:[{icon:'🧾',title:'결제 내역',text:'같은 서비스에서 매월 9,900원이 정기 결제되었다.'},{icon:'🎁',title:'체험 안내',text:'가입 당시 무료 체험 종료 후 유료 구독으로 전환된다는 안내가 있었다.'},{icon:'📅',title:'체험 종료일',text:'무료 체험 기간은 지난달에 종료되었다.'},{icon:'📲',title:'이용 기록',text:'최근 한 달 동안 해당 서비스를 거의 이용하지 않았다.'},{icon:'⚙️',title:'구독 설정',text:'서비스 계정 또는 앱스토어의 구독 관리 메뉴에서 갱신·해지 조건을 확인할 수 있다.'},{icon:'📌',title:'소비 습관',text:'정기 결제 목록을 점검하고 무료 체험 종료일을 기록하면 불필요한 지출을 줄일 수 있다.'}],questions:[{q:'매달 결제된 이유로 가장 타당한 것은?',options:['휴대전화 배터리가 부족해서','무료 체험 종료 후 자동 유료 전환되었기 때문에','인터넷 속도가 빨라서'],answer:1,why:'무료 체험 이후 자동 갱신 조건을 확인해야 합니다.'},{q:'지금 가장 적절한 행동은?',options:['구독 상태와 해지·환불 조건을 확인한다','결제 내역을 무시한다','서비스를 사용하지 않으면 결제가 자동으로 멈춘다고 생각한다'],answer:0,why:'사용 여부와 별개로 정기 결제가 유지될 수 있습니다.'},{q:'앞으로 예방하려면?',options:['무료 체험을 무조건 여러 개 신청한다','결제 알림을 모두 끈다','종료일을 기록하고 정기 결제 목록을 주기적으로 확인한다'],answer:2,why:'자동 갱신 일정을 관리하는 습관이 중요합니다.'}],culprit:'무료 체험 종료 후 자동 갱신된 구독',closing:'작은 정기 결제도 확인하지 않으면 불필요한 지출이 쌓인다!'},
{id:'lunch',difficulty:'중급',icon:'🍱',title:'사라진 도시락의 비밀',topic:'식생활 · 식품 위생',intro:'같은 도시락을 먹은 두 학생이 복통을 호소했다. 도시락에 무슨 일이 있었던 걸까?',story:'체육대회 날, 아침에 만든 달걀·햄 도시락을 먹은 학생 두 명이 오후에 배가 아프다고 말했다. 네가 식품안전 수사관이 되어 원인을 밝혀야 한다.',clues:[{icon:'🕗',title:'시간 기록',text:'도시락 조리 완료 07:10 → 교실 사물함에 보관 08:00 → 점심 12:40. 냉장 보관하지 않았다.'},{icon:'🌡️',title:'교실 온도',text:'교실 온도는 오전부터 29℃ 전후였다. 창가 쪽 사물함에는 햇빛이 들었다.'},{icon:'🥚',title:'도시락 메뉴',text:'달걀말이, 햄, 밥, 오이무침을 담았다. 익힌 재료도 잘못 보관하면 미생물이 증식할 수 있다.'},{icon:'👩‍🍳',title:'조리자 진술',text:'아침에는 손을 씻었고 재료도 익혔다. 그러나 완성 후 냉장하지 않고 가방에 넣어 두었다.'},{icon:'🧊',title:'다른 학생의 도시락',text:'같은 메뉴를 가져온 다른 학생은 보냉 가방과 얼음팩을 사용했으며 증상을 보이지 않았다.'},{icon:'📖',title:'안전 수칙',text:'상하기 쉬운 조리식품은 실온에 오래 방치하지 말고 신속히 식혀 냉장·보냉한다. 증상의 실제 원인은 조사·검사가 필요하다.'}],questions:[{q:'현재 증거로 가장 의심되는 위험 요인은?',options:['점심 시간이 조금 늦어진 것 자체','고온에서 상하기 쉬운 음식을 장시간 보관한 것','도시락 반찬의 색이 다양한 것'],answer:1,why:'고온에서 장시간 방치된 조리식품은 미생물 증식 위험이 커집니다.'},{q:'다음 체육대회에서 가장 적절한 예방 행동은?',options:['뜨거운 음식을 바로 밀폐해 햇볕에 둔다','냄새가 정상이라면 그대로 먹는다','충분히 식힌 뒤 냉장하고 이동 시 보냉팩을 사용한다'],answer:2,why:'안전한 온도 관리와 보냉이 핵심입니다.'},{q:'복통의 원인을 확정하려면 어떤 태도가 적절할까?',options:['도시락을 만든 사람의 잘못이라고 단정한다','증상과 보관 정보 등을 확인하고 필요하면 전문가의 진단·검사를 받는다','남은 도시락을 친구에게 먹여 확인한다'],answer:1,why:'증거로 위험 요인을 추정할 수 있지만 확진은 별도 확인이 필요합니다.'}],culprit:'높은 실온에서 장시간 보관한 도시락',closing:'진짜 범인은 특정 사람이 아니라 위험한 식품 보관 방식!'},

const STORE='techhome_cases_v2', RESULTS='techhome_results_v2';

else if(state.page==='case'){let c=cases[state.caseIndex],num=state.caseIndex+1, opened=state.opened.length;html+=`<section class="section"><div class="flex between"><div><span class="tag">CASE ${String(num).padStart(3,'0')} · ${esc(c.topic)}</span><h1 style="margin:8px 0">${esc(c.icon)} ${esc(c.title)}</h1></div><span class="pill">탐정: ${esc(state.name)}</span></div><div class="stage"><span class="${state.stage==='investigate'?'active':'passed'}">01 증거 수집</span><span class="${state.stage==='solve'?'active':state.stage==='report'?'passed':''}">02 최종 추리</span><span class="${state.stage==='report'?'active':''}">03 사건 보고서</span></div></section>`;

function setName(v){state.name=v;sessionStorage.setItem('detectiveName',v);const count=document.querySelector('.solved-count');if(count)count.textContent=solvedCount()+'/'+cases.length;document.querySelectorAll('[data-case-id]').forEach(el=>{let solved=!!studentProgress()[el.dataset.caseId];el.textContent=solved?'✅ 해결 완료':'🔒 미해결'});let old=document.querySelector('#badgeSection');if(old)old.remove();if(allSolved()){let target=document.querySelector('.section');if(target)target.insertAdjacentHTML('beforebegin',badgeMarkup())}}
function startCase(i){let entered=$('#name')?.value?.trim()||state.name.trim();if(!entered){alert('먼저 탐정 이름을 입력하세요.');$('#name')?.focus();return}state.name=entered;sessionStorage.setItem('detectiveName',entered);state.caseIndex=i;state.opened=[];state.answers={};state.stage='investigate';state.feedback=null;state.attempts=0;state.page='case';render();window.scrollTo(0,0)}
function setStage(x){state.stage=x;render();window.scrollTo(0,0)}
function openEvidence(i){if(!state.opened.includes(i)){state.opened.push(i);render()}let e=cases[state.caseIndex].clues[i];showModal(`<div class="sheet"><h3>${esc(e.icon)} 증거 ${i+1}: ${esc(e.title)}</h3><div class="desc">${esc(e.text)}</div></div><div style="margin-top:18px;text-align:right"><button class="btn" onclick="closeModal()">확인했어요 ✓</button></div>`)}
function choose(i,j){state.answers[i]=j;render()}
function submitCase(){let c=cases[state.caseIndex];if(Object.keys(state.answers).length<c.questions.length)return;let correct=c.questions.reduce((n,q,i)=>n+(q.answer===state.answers[i]?1:0),0);state.attempts++;state.feedback={correct,answers:{...state.answers}};records.push({date:new Date().toLocaleString('ko-KR'),name:state.name,caseId:c.id,caseTitle:c.title,score:correct,max:c.questions.length,attempt:state.attempts});if(correct===c.questions.length){progress[state.name.trim()]??={};progress[state.name.trim()][c.id]=true;save();setStage('report')}else{save();state.answers={};setStage('solve')}}
function hintMarkup(c,r){return `<div class="toast warning"><h3 style="margin:0 0 8px">🧩 아직 사건이 해결되지 않았어요! (${r.correct}/${c.questions.length})</h3><p>정답은 공개되지 않습니다. 다음 단서를 참고해 다시 추리해 보세요.</p>${c.questions.map((q,i)=>r.answers[i]===q.answer?'':`<p><b>Q${i+1} 힌트:</b> ${esc(hintFor(c,i))}</p>`).join('')}<p class="tiny">틀린 문항을 수정하거나 전체 답을 다시 선택해 제출하세요. 도전 횟수: ${state.attempts}회</p></div>`}
function hintFor(c,i){const n=c.clues.length;const clues=[c.clues[i%n],c.clues[(i+3)%n]].filter(Boolean);return `증거 「${clues.map(x=>x.title).join('」와 「')}」를 다시 읽으세요. 선택지 가운데 증거와 가장 일치하는 판단을 찾아보세요.`}
function badgeMarkup(){return `<section class="panel detective-badge" id="badgeSection"><div class="award-top">🏅 8개 사건 완전 해결</div><div class="medal">★</div><h2>명탐정 뱃지</h2><div class="award-name">${esc(state.name)} 탐정</div><p>생활 속 8개 사건의 모든 추리 문제를 정확히 해결하여<br>뛰어난 관찰력과 판단력을 증명하였기에 이 뱃지를 수여합니다.</p><div class="award-bottom">기술·가정 탐정단 · 생활 속 사건파일</div><div class="flex" style="justify-content:center;margin-top:18px"><button class="btn" onclick="downloadBadge()">🏅 뱃지 이미지 저장 (SVG)</button><button class="btn alt" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button></div></section>`}
function downloadBadge(){if(!allSolved())return;const name=esc(state.name);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" rx="36" fill="#142541"/><rect x="24" y="24" width="952" height="652" rx="27" fill="none" stroke="#f7ca6d" stroke-width="9"/><circle cx="500" cy="205" r="100" fill="#f7ca6d" stroke="#fff0b2" stroke-width="14"/><text x="500" y="240" text-anchor="middle" font-family="sans-serif" font-size="112" fill="#243553">★</text><text x="500" y="365" text-anchor="middle" font-family="sans-serif" font-size="66" font-weight="bold" fill="#ffdb85">명탐정 뱃지</text><text x="500" y="447" text-anchor="middle" font-family="sans-serif" font-size="45" fill="#ffffff">${name} 탐정</text><text x="500" y="513" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#d7e6ff">8개 사건의 모든 추리를 완벽하게 해결했습니다!</text><text x="500" y="614" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#a9c0e6">기술·가정 탐정단 · 생활 속 사건파일</text></svg>`;download(`${state.name.replace(/[\/:*?"<>|]/g,'_')}_명탐정뱃지.svg`,svg,'image/svg+xml;charset=utf-8')}

function downloadMyResult(){let c=cases[state.caseIndex],r=state.feedback;download(`${state.name}_사건해결결과.txt`,`기술·가정 생활 속 사건파일\n탐정: ${state.name}\n사건: ${c.title}\n점수: ${r.correct}/${c.questions.length}\n핵심 원인: ${c.culprit}\n수사 결론: ${c.closing}\n`,'text/plain;charset=utf-8')}
function download(filename,contents,mime){let a=document.createElement('a'),blob=new Blob([contents],{type:mime});a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function showModal(content){$('#modalInner').innerHTML=content;$('#modal').classList.remove('hide')}
function closeModal(){$('#modal').classList.add('hide')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function teacherLogin(){showModal(`<h2>🔐 교사용 관리실</h2><input id="pwd" type="password" class="input" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkPwd()"><div class="flex" style="margin-top:18px"><button class="btn" onclick="checkPwd()">입장</button><button class="btn alt" onclick="closeModal()">취소</button></div>`)}
function checkPwd(){if($('#pwd').value==='0000')teacherPanel();else alert('비밀번호를 확인하세요.')}
function teacherPanel(){showModal(`<h2>⚙️ 교사용 관리실</h2><p class="muted">학생 결과는 각 크롬북의 브라우저에만 저장됩니다. 이 화면은 여러 기기의 결과를 자동으로 수집하지 않습니다.</p><div class="grid"><button class="btn" onclick="exportCases()">📤 사건 JSON 내보내기</button><button class="btn alt" onclick="document.getElementById('importFile').click()">📥 사건 JSON 불러오기</button><button class="btn alt" onclick="exportCSV()">📊 이 기기 결과 CSV 저장</button><button class="btn red" onclick="resetCases()">↺ 기본 사건 복원</button></div><input type="file" id="importFile" accept=".json,application/json" class="hide" onchange="importCases(event)"><p style="margin-top:16px"><b>사건별 정답 및 해설</b></p><div class="answer-key">${cases.map((c,i)=>`<details style="margin:9px 0;padding:12px;border:1px solid #536688;border-radius:12px"><summary style="cursor:pointer;font-weight:700">CASE ${String(i+1).padStart(3,'0')} · ${esc(c.title)}</summary>${c.questions.map((q,j)=>`<div style="margin-top:12px"><b>Q${j+1}. ${esc(q.q)}</b><div style="color:#ffdb79">정답: ${'ABC'[q.answer]}. ${esc(q.options[q.answer])}</div><div class="muted">해설: ${esc(q.why)}</div></div>`).join('')}</details>`).join('')}</div><p style="margin-top:16px"><b>사건 편집</b></p><p class="sub">아래 JSON에서 difficulty 값을 초급·중급·고급 중 하나로 변경할 수 있습니다. 아래 JSON을 직접 수정해 적용할 수도 있습니다. 정답 인덱스는 0, 1, 2 중 하나입니다.</p><textarea id="caseJson" class="input" rows="12" style="font-size:12px;min-height:280px;font-family:monospace">${esc(JSON.stringify(cases,null,2))}</textarea><div class="flex" style="margin-top:12px"><button class="btn" onclick="applyJson()">✅ 수정 내용 적용</button><button class="btn alt" onclick="closeModal()">닫기</button></div>`)}
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('사건은 1개 이상의 배열이어야 합니다.');for(let c of data){if(c.difficulty&&!['초급','중급','고급'].includes(c.difficulty))throw Error('난이도는 초급, 중급, 고급 중에서 선택하세요.');if(!c.id||!c.title||!c.story||!c.topic||!c.intro||!c.icon||!c.culprit||!c.closing)throw Error('사건의 기본 필드가 누락되었습니다.');if(!Array.isArray(c.clues)||c.clues.length<1||c.clues.some(e=>!e.title||!e.text||!e.icon))throw Error('증거 정보를 확인하세요.');if(!Array.isArray(c.questions)||c.questions.length<1||c.questions.some(q=>!q.q||!Array.isArray(q.options)||q.options.length!==3||!Number.isInteger(q.answer)||q.answer<0||q.answer>2||!q.why))throw Error('질문은 선택지 3개와 정답 인덱스(0~2), 해설이 필요합니다.')}if(new Set(data.map(x=>x.id)).size!==data.length)throw Error('사건 id는 중복되면 안 됩니다.');return data}
function applyJson(){try{cases=validate(JSON.parse($('#caseJson').value));save();closeModal();showHome();alert('사건 데이터가 적용되었습니다.')}catch(e){alert('JSON 오류: '+e.message)}}
function exportCases(){download('생활속사건파일_교사용_사건데이터.json',JSON.stringify(cases,null,2),'application/json')}
function importCases(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader;reader.onload=()=>{try{cases=validate(JSON.parse(reader.result));save();teacherPanel();alert('사건 데이터 불러오기 완료')}catch(err){alert('불러오기 실패: '+err.message)}};reader.readAsText(file)}
function resetCases(){if(confirm('사건 데이터를 기본값으로 되돌릴까요?')){cases=structuredClone(DEFAULT_CASES);save();teacherPanel();showHome()}}
function exportCSV(){const rows=[['일시','학생','사건ID','사건명','정답수','전체문항수'],...records.map(x=>[x.date,x.name,x.caseId,x.caseTitle,x.score,x.max])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');download('사건파일_이기기_학습결과.csv',csv,'text/csv;charset=utf-8')}
render();
</script></body></html>
